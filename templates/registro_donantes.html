<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrar donante</title>
<style>
  :root {
    --sangre: #a01220;
    --sangre-oscuro: #6b0b15;
    --gris-fondo: #dcdee1;
    --gris-claro: #eceef0;
    --gris-borde: #b9bdc3;
    --gris-texto: #33363b;
    --gris-suave: #666b73;
    --blanco: #fbfbfb;
    --ok: #2c6a3c;
    --aviso: #96640a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--gris-fondo); color: var(--gris-texto);
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }

  header {
    width: 100%; background: var(--sangre); color: #fff; text-align: center;
    border-bottom: 6px solid var(--sangre-oscuro); padding: 26px 16px 22px;
  }
  header h1 { margin: 0; font-size: 1.7rem; font-weight: 600; letter-spacing: .4px; }
  header p { margin: 6px 0 0; font-size: .95rem; color: #f1d4d7; }

  main { width: 100%; max-width: 560px; padding: 26px 16px 10px; }

  .panel {
    background: var(--blanco); border: 1px solid var(--gris-borde); border-radius: 3px;
    box-shadow: 0 1px 0 var(--gris-borde);
    padding: 22px 24px 26px; margin-bottom: 20px; overflow: hidden;
  }
  .panel h2 {
    margin: -22px -24px 20px; padding: 10px 24px; font-size: 1rem; font-weight: 600;
    background: var(--gris-claro); color: var(--sangre-oscuro); text-align: left;
    border-bottom: 1px solid var(--gris-borde); border-left: 5px solid var(--sangre);
  }
  #panelResultado.exito h2 { color: var(--ok); border-left-color: var(--ok); }
  #panelResultado.aviso h2 { color: var(--aviso); border-left-color: var(--aviso); }

  .campo { margin-bottom: 16px; }
  .fila { display: flex; gap: 12px; }
  .fila .campo { flex: 1; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  label .opcional { font-weight: 400; color: var(--gris-suave); font-size: .85rem; }
  input, select {
    width: 100%; padding: 10px 12px; font-size: 1rem;
    border: 1px solid var(--gris-borde); border-radius: 3px; background: #fff; color: inherit;
  }
  .ayuda { font-size: .85rem; color: var(--gris-suave); margin: -4px 0 16px; }

  button {
    padding: 10px 22px; font-size: 1rem; font-weight: 600; cursor: pointer;
    border: 1px solid var(--sangre-oscuro); border-radius: 3px; background: var(--sangre); color: #fff;
  }
  button:hover:not(:disabled) { background: var(--sangre-oscuro); }
  button:disabled { background: #b9a3a6; cursor: not-allowed; }
  button.sec { background: #fff; color: var(--sangre-oscuro); border-color: var(--gris-borde); }
  button.sec:hover { background: var(--gris-claro); }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid #d98a92; outline-offset: 2px; }
  .botones { display: flex; gap: 8px; margin-top: 8px; }

  .donante dl { display: grid; grid-template-columns: 1fr auto; margin: 0; }
  .donante dt, .donante dd { padding: 9px 4px; border-bottom: 1px solid var(--gris-claro); }
  .donante dt { color: var(--gris-suave); }
  .donante dd { margin: 0; font-weight: 600; text-align: right; }
  .donante dt:nth-last-of-type(1), .donante dd:last-of-type { border-bottom: 0; }
  .sangre-tipo {
    display: inline-block; min-width: 44px; text-align: center; background: #fff;
    border: 2px solid var(--sangre); color: var(--sangre); font-weight: 700; padding: 0 10px; border-radius: 3px;
  }
  .estado { display: inline-block; font-weight: 600; padding: 1px 10px; border-radius: 3px; color: #fff; }
  .estado.apto { background: var(--ok); }
  .estado.no-apto { background: var(--aviso); }
  .estado.rechazado { background: var(--sangre-oscuro); }
  .estado.sin-evaluar { background: var(--gris-suave); }

  .msg { border-radius: 3px; padding: 12px 14px; margin-top: 16px; font-weight: 600; }
  .msg ul { margin: 6px 0 0; padding-left: 20px; font-weight: 400; }
  .msg.error { background: #f6e1e3; border: 1px solid var(--sangre); color: var(--sangre-oscuro); }
  .msg.exito { background: #e1efe4; border: 1px solid var(--ok); color: var(--ok); }
  .msg.aviso { background: #fdf5e6; border: 1px solid var(--aviso); color: var(--aviso); }
  .oculto { display: none; }
  @media (max-width: 480px) { .fila { flex-direction: column; gap: 0; } header h1 { font-size: 1.4rem; } }
</style>
</head>
<body>
<header>
  <h1>Registrar donante</h1>
  <p>Centro de donación · Personal de atención al donante</p>
</header>

<main>
  <section class="panel">
    <h2>Datos del donante</h2>
    <form id="formDonante" novalidate>
      <div class="campo">
        <label for="run">RUN</label>
        <input type="text" id="run" placeholder="12.345.678-5" autocomplete="off">
      </div>
      <div class="ayuda">Si el donante ya está registrado, basta con ingresar su RUN y presionar Guardar.</div>

      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" autocomplete="off">
      </div>

      <div class="fila">
        <div class="campo">
          <label for="grupo">Grupo sanguíneo</label>
          <select id="grupo">
            <option value="">-- Seleccione --</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="AB">AB</option>
            <option value="O">O</option>
          </select>
        </div>
        <div class="campo">
          <label for="rh">Factor Rh</label>
          <select id="rh">
            <option value="">-- Seleccione --</option>
            <option value="+">Positivo (+)</option>
            <option value="-">Negativo (-)</option>
          </select>
        </div>
      </div>

      <div class="fila">
        <div class="campo">
          <label for="correo">Correo</label>
          <input type="text" id="correo" placeholder="nombre@correo.cl" inputmode="email" autocomplete="off">
        </div>
        <div class="campo">
          <label for="telefono">Teléfono</label>
          <input type="text" id="telefono" placeholder="+56 9 1234 5678" inputmode="tel" autocomplete="off">
        </div>
      </div>
      <div class="ayuda">Debe ingresar al menos un contacto (correo o teléfono).</div>

      <div class="fila">
        <div class="campo">
          <label for="fechaNacimiento">Fecha de nacimiento <span class="opcional">(opcional)</span></label>
          <input type="date" id="fechaNacimiento">
        </div>
        <div class="campo">
          <label for="peso">Peso en kg <span class="opcional">(opcional)</span></label>
          <input type="text" id="peso" inputmode="decimal" placeholder="70">
        </div>
      </div>

      <div class="botones">
        <button type="submit" id="btnGuardar">Guardar</button>
        <button type="button" class="sec" id="btnLimpiar">Limpiar</button>
      </div>
      <div id="msgFormulario" class="msg oculto" role="alert"></div>
    </form>
  </section>

  <section class="panel donante oculto" id="panelResultado">
    <h2 id="tituloResultado"></h2>
    <dl>
      <dt>Nombre</dt><dd id="dNombre"></dd>
      <dt>RUN</dt><dd id="dRun"></dd>
      <dt>Tipo de sangre</dt><dd><span class="sangre-tipo" id="dSangre"></span></dd>
      <dt>Contacto</dt><dd id="dContacto"></dd>
      <dt>Estado</dt><dd><span class="estado" id="dEstado"></span></dd>
    </dl>
  </section>
</main>

<script>
  const NOMBRE_ESTADO = { APTO: "Apto", DIFERIDO_TEMPORAL: "Diferido temporal", RECHAZADO_PERMANENTE: "Rechazado permanente" };
  const CLASE_ESTADO = { APTO: "apto", DIFERIDO_TEMPORAL: "no-apto", RECHAZADO_PERMANENTE: "rechazado" };

  function $(id) { return document.getElementById(id); }

  function mostrarMensaje(titulo, lista, tipo) {
    const caja = $("msgFormulario");
    caja.textContent = titulo;
    if (lista && lista.length > 0) {
      const ul = document.createElement("ul");
      lista.forEach(function (texto) {
        const li = document.createElement("li");
        li.textContent = texto;
        ul.appendChild(li);
      });
      caja.appendChild(ul);
    }
    caja.className = "msg " + tipo;
  }

  function ocultarResultados() {
    $("msgFormulario").className = "msg oculto";
    $("panelResultado").classList.add("oculto");
  }

  function mostrarDonante(titulo, d, tipo) {
    $("tituloResultado").textContent = titulo;
    $("dNombre").textContent = d.nombre;
    $("dRun").textContent = d.run;
    $("dSangre").textContent = d.tipo_sangre;
    $("dContacto").textContent = [d.correo, d.telefono].filter(Boolean).join(" · ");
    $("dEstado").textContent = NOMBRE_ESTADO[d.estado] || "Sin evaluar";
    $("dEstado").className = "estado " + (CLASE_ESTADO[d.estado] || "sin-evaluar");
    $("panelResultado").className = "panel donante " + tipo;
  }

  function textosDeError(detail) {
    // 400: lista de mensajes; 422 (FastAPI): lista de objetos con msg
    if (typeof detail === "string") return [detail];
    if (Array.isArray(detail)) {
      return detail.map(function (d) { return typeof d === "string" ? d : d.msg; });
    }
    return ["Ocurrió un error inesperado."];
  }

  async function guardar(event) {
    event.preventDefault();
    ocultarResultados();
    $("btnGuardar").disabled = true;

    const datos = {
      run: $("run").value,
      nombre: $("nombre").value,
      grupo_sanguineo: $("grupo").value,
      factor_rh: $("rh").value,
      correo: $("correo").value,
      telefono: $("telefono").value,
      fecha_nacimiento: $("fechaNacimiento").value,
      peso_kg: $("peso").value
    };

    try {
      const response = await fetch("/donantes/registrar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(datos)
      });
      const result = await response.json();

      if (response.ok) {
        mostrarMensaje(result.mensaje, [], "exito");
        mostrarDonante("Donante registrado", result.donante, "exito");
        $("formDonante").reset();
      } else if (response.status === 409) {
        mostrarMensaje(result.mensaje + " No se creó un registro nuevo.", [], "aviso");
        mostrarDonante("Donante ya registrado", result.donante, "aviso");
      } else {
        mostrarMensaje("No se pudo guardar el donante:", textosDeError(result.detail), "error");
      }
    } catch (error) {
      mostrarMensaje("Error de conexión con el servidor.", [], "error");
    }

    $("btnGuardar").disabled = false;
  }

  function limpiar() {
    $("formDonante").reset();
    ocultarResultados();
    $("run").focus();
  }

  $("formDonante").addEventListener("submit", guardar);
  $("btnLimpiar").addEventListener("click", limpiar);
</script>
</body>
</html>
